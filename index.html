<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventskalender 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="snow-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>

  <header>
    <div class="header-brand">
      <img src="assets/discodogs-logo-dark.png" alt="Discodogs" class="header-logo">
      <h1>Adventskalender 2026</h1>
    </div>
    <div class="progress-bar" id="progress-display">0/24 gelöst</div>
  </header>

  <div id="countdown-banner" class="countdown-banner hidden"></div>

  <main>
    <div class="calendar-grid" id="calendar-grid"></div>
  </main>

  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Türchen</h2>
        <button id="modal-close" class="modal-close" aria-label="Schließen">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-hint" class="modal-hint hidden"></div>
        <div id="game-root"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="app.js"></script>
  <script src="games/day01.js" onerror="this.remove()"></script>
  <script src="games/day02.js" onerror="this.remove()"></script>
  <script src="games/day03.js" onerror="this.remove()"></script>
  <script src="games/day04.js" onerror="this.remove()"></script>
